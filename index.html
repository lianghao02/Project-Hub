<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LiangHao 的公開作品展示入口：AI、鑑識、自動化與 Windows 原生工具。">
  <meta name="author" content="LiangHao">
  <title>LiangHao's Projects | 專案作品展示</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg:#f3f5f8; --surface:rgba(255,255,255,.9); --card:rgba(255,255,255,.94); --border:rgba(107,139,176,.25); --text:#2b364b; --muted:#667080; --accent:#526f94; --shadow:0 8px 30px rgba(160,175,195,.16); --radius:1.25rem; --transition:.25s ease; --font:"Microsoft JhengHei","Segoe UI",system-ui,sans-serif; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; min-width:320px; color:var(--text); background:var(--bg); font-family:var(--font); line-height:1.6; }
    #particle-canvas { position:fixed; inset:0; z-index:-1; opacity:.55; pointer-events:none; } a { color:inherit; } header { background:rgba(255,255,255,.72); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); }
    .header-inner { max-width:1240px; min-height:72px; margin:auto; padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .brand { display:flex; align-items:center; gap:.7rem; text-decoration:none; font-weight:700; font-size:1.1rem; } .brand-icon { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(135deg,#526f94,#7788a5); }
    .github-btn { display:inline-flex; align-items:center; gap:.45rem; border:1px solid var(--border); border-radius:.7rem; padding:.55rem .8rem; color:var(--text); text-decoration:none; font-size:.9rem; font-weight:600; background:var(--surface); transition:transform var(--transition),border-color var(--transition); } .github-btn:hover { transform:translateY(-2px); border-color:var(--accent); }
    .hero { max-width:1000px; margin:auto; padding:5.5rem 1.5rem 3.5rem; text-align:center; } .hero-badge { display:inline-flex; align-items:center; gap:.45rem; padding:.35rem .7rem; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--accent); font-weight:600; font-size:.85rem; }
    .hero-title { margin:1rem 0 .8rem; font-size:clamp(2rem,5vw,3.6rem); line-height:1.2; letter-spacing:-.04em; } .hero-title span { color:var(--accent); } .hero-subtitle { max-width:760px; margin:auto; color:var(--muted); font-size:1.05rem; }
    main { max-width:1240px; margin:auto; padding:0 1.5rem 4rem; } section { margin-top:3rem; } .section-header { margin-bottom:1.25rem; } .section-title-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; } .section-title { margin:0; font-size:clamp(1.3rem,3vw,1.7rem); } .section-count-badge { flex-shrink:0; color:var(--accent); background:rgba(82,111,148,.1); border-radius:999px; padding:.25rem .6rem; font-size:.82rem; font-weight:700; } .section-desc { margin:.45rem 0 0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.25rem; } .card { min-width:0; overflow:hidden; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); text-decoration:none; transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition); } .card:hover { transform:translateY(-5px); border-color:rgba(82,111,148,.6); box-shadow:0 16px 38px rgba(107,139,176,.25); } .card:focus-visible,.github-btn:focus-visible,.brand:focus-visible { outline:3px solid #1d70d6; outline-offset:3px; }
    .card-banner { aspect-ratio:16/9; overflow:hidden; background:#dfe5ec; } .card-banner img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .45s ease; } .card:hover .card-banner img { transform:scale(1.04); } .card-body { min-height:220px; display:flex; flex:1; flex-direction:column; padding:1.15rem; } .card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:.75rem; } .card-title { margin:0; font-size:1.05rem; line-height:1.4; } .badge-group { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.3rem; } .badge,.tag { border-radius:999px; white-space:nowrap; } .badge { padding:.16rem .45rem; background:#edf1f5; color:#546274; font-size:.7rem; font-weight:700; } .badge-web { background:#e4f2e8; color:#3c7050; } .badge-native { background:#eee9f5; color:#645282; } .badge-ai { background:#e5edf8; color:#3d628f; } .card-desc { margin:.8rem 0 1rem; color:var(--muted); font-size:.9rem; } .card-footer { display:flex; flex-direction:column; align-items:flex-start; gap:.8rem; margin-top:auto; } .tags { display:flex; flex-wrap:wrap; gap:.35rem; } .tag { padding:.18rem .5rem; background:#f1f3f6; color:#566273; font-size:.72rem; } .btn-link { color:var(--accent); font-weight:700; font-size:.9rem; }
    footer { padding:2.5rem 1.5rem; border-top:1px solid var(--border); text-align:center; color:var(--muted); font-size:.9rem; } footer p { margin:.2rem 0; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (max-width:600px) { .header-inner { min-height:64px; padding:0 1rem; } .brand-title { font-size:.95rem; } .github-btn { padding:.48rem .65rem; } .hero { padding:3.7rem 1rem 2.2rem; } main { padding:0 1rem 3rem; } .grid { grid-template-columns:1fr; gap:1rem; } .card-body { min-height:auto; } .section-title-row { align-items:flex-start; } .section-count-badge { margin-top:.15rem; } }
  </style>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <header><div class="header-inner"><a href="#" class="brand" aria-label="回到 LiangHao Project Hub 首頁"><span class="brand-icon" aria-hidden="true"><i class="fa-solid fa-code"></i></span><span class="brand-title">LiangHao's Hub</span></a><a href="https://github.com/lianghao02" target="_blank" rel="noopener noreferrer" class="github-btn"><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub</a></div></header>
  <section class="hero" aria-labelledby="hero-title"><div class="hero-badge"><i class="fa-solid fa-briefcase" aria-hidden="true"></i> Public Portfolio</div><h1 id="hero-title" class="hero-title">AI、鑑識與<span>實用工具作品集</span></h1><p class="hero-subtitle">LiangHao 的公開作品展示入口，收錄可直接使用的前端工具、Windows 原生應用程式與 AI 自動化專案。</p></section>
  <main id="projects" aria-live="polite" aria-label="專案作品列表">載入專案資料中…</main>
  <footer><p>© <span id="year"></span> LiangHao. All rights reserved.</p><p>目前展示 <span id="project-count">0</span> 個公開作品。</p></footer>
</body>
</html>
